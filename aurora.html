<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOXEL // AURORA CIRCUIT — Skin Gallery</title><style>body{margin:0;background:#101b24;color:#e8fbff;font:14px Segoe UI,Arial,sans-serif}header{padding:26px 5vw;background:linear-gradient(120deg,#142b3a,#242046);border-bottom:1px solid #55e7ff}h1{margin:8px 0;font-size:clamp(28px,5vw,62px);letter-spacing:.04em}p{color:#a9c8d1;max-width:690px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;padding:24px 5vw}.card{background:#172832;border:1px solid #285264;padding:10px;transition:.15s}.card:hover{transform:translateY(-4px);border-color:#9b6cff;box-shadow:0 0 20px #63e6ff33}.card img{width:100%;image-rendering:pixelated;background:#0b131b}.name{font-size:11px;line-height:1.45;color:#d7f4ff;margin-top:8px}.meta{font-size:10px;color:#6cdcc3;text-transform:uppercase;letter-spacing:.1em;margin-top:4px}a{color:#73ffc8}</style></head><body><header><div style="color:#73ffc8;letter-spacing:.25em;font-size:11px">VOXEL // THEMED LINE 03</div><h1>AURORA CIRCUIT</h1><p>Arctic expedition tech meets holographic streetwear: 36 seed-stable skins with polar light, mint, violet and comet accents. Generated by the same procedural painter as CYBER-STREET and NEON HERITAGE.</p><a href="dual-store.html">← Collection store page</a></header><main class="grid" id="grid"></main><script>fetch('pack-aurora/pack.json').then(r=>r.json()).then(pack=>{document.querySelector('#grid').innerHTML=pack.skins.map(s=>`<article class="card"><img loading="lazy" src="pack-aurora/${s.file}" alt="Aurora Circuit skin ${s.id}"><div class="name">AURORA CIRCUIT // ${String(s.id).padStart(2,'0')}</div><div class="meta">${s.accent} · ${s.fit} · seed ${s.seed}</div></article>`).join('')});</script></body></html>
