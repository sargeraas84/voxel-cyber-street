<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXEL // CYBER-TEEN — Minecraft Character Reference Sheet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1f2023; }
  body { font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color:#cfd3d9; }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:34px; z-index:20;
    display:flex; align-items:center; gap:10px; padding:0 14px;
    background:rgba(24,25,28,.92); border-bottom:1px solid #33353a;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8f949c;
    white-space:nowrap;
  }
  .topbar b{ color:#e8ebee; letter-spacing:.18em; font-weight:600; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#ff2d95; box-shadow:0 0 8px #ff2d95; }
  .dot.c{ background:#19e3ff; box-shadow:0 0 8px #19e3ff; }
  .topbar .spacer{ flex:1; }
  .topbar .hint{ color:#6b7078; letter-spacing:.08em; text-transform:none; }
  @media (max-width:1000px){ .topbar .hint{ display:none; } }

  .btn{
    border:1px solid #4a4d55; background:#26282d; color:#dfe3e8; font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; padding:5px 12px; cursor:pointer;
    border-radius:2px; transition:all .15s;
  }
  .btn:hover{ background:#33363d; border-color:#5a5e67; }
  .btn.primary{ border-color:#ff2d95; color:#ff9ccb; }
  .btn.primary:hover{ background:#3a2030; }
  .btn.on{ border-color:#19e3ff; color:#9cefff; background:#153038; }

  .animbar{
    position:fixed; left:12px; bottom:12px; z-index:20; display:flex; gap:6px;
  }
  .legend{
    position:fixed; right:12px; bottom:12px; z-index:20;
    background:rgba(24,25,28,.9); border:1px solid #33353a; border-radius:3px;
    padding:8px 12px; font-size:10px; letter-spacing:.1em; color:#8f949c;
    text-transform:uppercase;
  }
  .legend span{ color:#c9cdd3; }

  #wrap{ position:fixed; inset:34px 0 0 0; }
  canvas{ display:block; }

  .loader{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:#1f2023; font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:#8f949c;
    transition:opacity .5s;
  }
  .loader.hide{ opacity:0; pointer-events:none; }
  .loader .p{ color:#19e3ff; animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>
<body>

<div class="loader" id="loader"><span>INITIALIZING RENDER&nbsp;</span><span class="p">▮▮▮</span></div>

<div class="topbar">
  <span class="dot"></span><span class="dot c"></span>
  <b>VOXEL // CYBER-TEEN</b>
  <span>Minecraft skin · 64×64</span>
  <span class="spacer"></span>
  <span class="hint">drag hero to orbit · scroll to zoom</span>
  <button class="btn" id="btnSpin">Spin</button>
  <button class="btn" id="btnSeed">Re-roll</button>
  <button class="btn" id="btnCape">Cape</button>
  <button class="btn" id="btnGallery">Gallery</button>
  <button class="btn primary" id="btnSave">⬇ PNG</button>
</div>

<div class="animbar">
  <button class="btn on" data-anim="idle">Idle</button>
  <button class="btn" data-anim="walk">Walk</button>
  <button class="btn" data-anim="wave">Wave</button>
  <button class="btn" data-anim="dance">Dance</button>
</div>

<div id="wrap"></div>

<div class="legend">
  Sheet: <span>Hero ¾ · Front · Side · Rear</span> &nbsp;|&nbsp; Fit: <span id="legendFit">—</span>
</div>

<script src="skin-gen-core.js"></script>
<script src="character-rig.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.35.3/build/index.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import * as POST_B from 'postprocessing';
import { EffectComposer, RenderPass, EffectPass, BloomEffect } from 'postprocessing';
/* ============================================================================
   VOXEL // CYBER-TEEN — reference sheet
   4 scissored viewports, each with its own camera + postprocessing composer
   (real UnrealBloomPass for the neon), shared skin textures via SkinGenCore,
   animated rig via CharacterRig (idle/walk/wave/dance).
   ========================================================================== */
const { createSkin, ACCENTS, HAIRS, FITS } = window.SkinGenCore;

let SEED = 1337;
let CUR = null; // { canvas, glowCanvas, desc }

// deep link: ?accent=violet-pink&hair=ice-blue&fit=longline&seed=42&anim=dance
const QS = new URLSearchParams(location.search);
if(QS.get('seed')) SEED = parseInt(QS.get('seed'),10)>>>0;

// ---------------- textures
let texCanvas, texGlow, texCape, texCapeGlow;
function ensureTextures(){
  if(!CUR){
    CUR = createSkin({ seed: SEED, cape: true,
      accent: QS.get('accent'), hair: QS.get('hair'), fit: QS.get('fit') });
  }
  if(!texCanvas){
    texCanvas = new THREE.CanvasTexture(CUR.canvas);
    texGlow   = new THREE.CanvasTexture(CUR.glowCanvas);
    texCape     = new THREE.CanvasTexture(CUR.capeCanvas);
    texCapeGlow = new THREE.CanvasTexture(CUR.capeGlowCanvas);
    for(const t of [texCanvas, texGlow, texCape, texCapeGlow]){
      t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
      t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
    }
  }
}
function repaint(){
  CUR = createSkin({ seed: SEED, cape: true });
  texCanvas.image = CUR.canvas; texCanvas.needsUpdate = true;
  texGlow.image = CUR.glowCanvas; texGlow.needsUpdate = true;
  texCape.image = CUR.capeCanvas; texCape.needsUpdate = true;
  texCapeGlow.image = CUR.capeGlowCanvas; texCapeGlow.needsUpdate = true;
  document.getElementById('legendFit').textContent =
    `${CUR.desc.fit} · ${CUR.desc.accent} · ${CUR.desc.hair}`;
}

// ---------------- scene
const wrap = document.getElementById('wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1f2023);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
keyLight.position.set(60, 90, 80);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x19e3ff, 0.55);
rimLight.position.set(-70, 40, -60);
scene.add(rimLight);
const pinkRim = new THREE.DirectionalLight(0xff2d95, 0.4);
pinkRim.position.set(80, 20, -50);
scene.add(pinkRim);
scene.add(new THREE.AmbientLight(0x8a93a5, 0.7));

const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

// pedestal
function mkPedestal(){
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(10.5, 12, 1.6, 48),
    new THREE.MeshLambertMaterial({ color:0x26282d }));
  mesh.position.y = -0.8;
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(10.8, 0.28, 8, 64),
    new THREE.MeshBasicMaterial({ color:0x19e3ff, transparent:true, opacity:0.85 }));
  ring.rotation.x = Math.PI/2; ring.position.y = 0.3; mesh.add(ring);
  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(11.8, 0.18, 8, 64),
    new THREE.MeshBasicMaterial({ color:0xff2d95, transparent:true, opacity:0.7 }));
  ring2.rotation.x = Math.PI/2; ring2.position.y = 0.3; mesh.add(ring2);
  return mesh;
}
scene.add(mkPedestal());

// character
ensureTextures();
const CHAR = window.CharacterRig.createCharacter(THREE, texCanvas, texGlow, {
  texCape, texCapeGlow,
});
scene.add(CHAR.root);
window.__dbg = { CHAR, scene, renderer };
document.getElementById('legendFit').textContent =
  `${CUR.desc.fit} · ${CUR.desc.accent} · ${CUR.desc.hair}`;
const animFromQS = QS.get('anim');
if(animFromQS && CHAR.ANIMS.includes(animFromQS)) CHAR.snapTo(animFromQS);
let capeOn = QS.get('cape') === '1';
CHAR.setCape(capeOn);
document.getElementById('btnCape').classList.toggle('on', capeOn);

// ---------------- viewports + composers
let viewRects = [], comps = [], cams = {};
function computeRects(w, h){
  const pad = 8;
  const colW = w*0.68;
  const rightW = w - colW - pad*3;
  const rowH = (h - pad*4)/3;
  viewRects = [
    { x:pad, y:pad, w:colW, h:h-pad*2, name:'hero' },
    { x:colW+pad*2, y:pad, w:rightW, h:rowH, name:'front' },
    { x:colW+pad*2, y:rowH+pad*2, w:rightW, h:rowH, name:'left' },
    { x:colW+pad*2, y:rowH*2+pad*3, w:rightW, h:rowH, name:'rear' },
  ];
}
function mkCam(name, w, h){
  const cam = new THREE.PerspectiveCamera(name==='hero'?26:24, w/h, 0.1, 1000);
  const cy = 15, dist = name==='hero' ? 105 : 95;
  const P = { hero:[42, cy+10, 55], front:[0, cy+10, 95], left:[-95, cy+10, 0], rear:[0, cy+10, -95] }[name];
  cam.position.set(P[0],P[1],P[2]); cam.lookAt(0,cy,0);
  return cam;
}
function mkComposer(rect){
  const cam = mkCam(rect.name, rect.w, rect.h);
  const comp = new EffectComposer(renderer);
  comp.addPass(new RenderPass(scene, cam));
  // real mipmap bloom — threshold tuned so neon (lum 0.46–0.66) blooms, fabrics don't
  const bloom = new BloomEffect({
    blendFunction: POST_B.BlendFunction.ADD,
    mipmapBlur: true,
    luminanceThreshold: 0.45,
    luminanceSmoothing: 0.3,
    intensity: 1.6,
    radius: 0.8,
  });
  comp.addPass(new EffectPass(cam, bloom));
  return { comp, cam, bloom };
}
function rebuildComposers(){
  comps.forEach(c=>c.comp.dispose && c.comp.dispose());
  comps = viewRects.map(r => mkComposer(r));
  cams = {}; comps.forEach((c,i)=> cams[viewRects[i].name] = c.cam);
}

// hero orbit
const orbit = { theta:0.62, phi:1.25, dist:105, auto:false, tgtY:15 };
let dragging=false, lastX=0, lastY=0;
renderer.domElement.addEventListener('pointerdown', e=>{
  const r = renderer.domElement.getBoundingClientRect();
  const x = e.clientX-r.left, y = e.clientY-r.top;
  const hr = viewRects[0];
  if(hr && x>=hr.x && x<=hr.x+hr.w && y>=hr.y && y<=hr.y+hr.h){ dragging=true; lastX=e.clientX; lastY=e.clientY; }
});
window.addEventListener('pointerup', ()=> dragging=false);
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  orbit.theta -= (e.clientX-lastX)*0.008;
  orbit.phi = Math.max(0.6, Math.min(2.2, orbit.phi - (e.clientY-lastY)*0.006));
  lastX=e.clientX; lastY=e.clientY;
});
renderer.domElement.addEventListener('wheel', e=>{
  const r = renderer.domElement.getBoundingClientRect();
  const x = e.clientX-r.left, y = e.clientY-r.top;
  const hr = viewRects[0];
  if(hr && x>=hr.x && x<=hr.x+hr.w && y>=hr.y && y<=hr.y+hr.h){
    orbit.dist = Math.max(55, Math.min(170, orbit.dist + e.deltaY*0.05));
    e.preventDefault();
  }
}, { passive:false });

// labels overlay
const overlay = document.createElement('canvas');
const octx = overlay.getContext('2d');
wrap.appendChild(overlay);
Object.assign(overlay.style, { position:'absolute', inset:'0', pointerEvents:'none' });
function drawLabels(){
  octx.clearRect(0,0,overlay.width,overlay.height);
  octx.font = '10px Segoe UI, Arial';
  octx.fillStyle = 'rgba(160,166,175,0.9)';
  const names = ['HERO ¾ VIEW — drag to orbit', 'FRONT', 'SIDE', 'REAR'];
  viewRects.forEach((r,i)=> octx.fillText(names[i], r.x+8, r.y+16));
}

function resize(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  overlay.width = w; overlay.height = h;
  overlay.style.width = w+'px'; overlay.style.height = h+'px';
  computeRects(w, h);
  rebuildComposers();
  drawLabels();
}
window.addEventListener('resize', resize);

function renderViews(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setScissorTest(false);
  renderer.setClearColor(0x1f2023, 1);
  renderer.clear();
  renderer.setScissorTest(true);
  viewRects.forEach((r, i)=>{
    const vx = r.x, vy = h - r.y - r.h;
    renderer.setViewport(vx, vy, r.w, r.h);
    renderer.setScissor(vx, vy, r.w, r.h);
    const c = comps[i];
    if(r.name==='hero'){
      if(orbit.auto) orbit.theta += 0.004;
      const cy = orbit.tgtY;
      const px = orbit.dist*Math.sin(orbit.phi)*Math.sin(orbit.theta);
      const py = cy + orbit.dist*0.18;
      const pz = orbit.dist*Math.sin(orbit.phi)*Math.cos(orbit.theta);
      c.cam.position.set(px,py,pz);
      c.cam.lookAt(0,cy,0);
    }
    c.comp.render();
  });
  renderer.setScissorTest(false);
}

// ---------------- loop
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  CHAR.tick(dt);
  renderViews();
  drawLabels();
}

// ---------------- UI
document.getElementById('btnSpin').addEventListener('click', e=>{
  orbit.auto = !orbit.auto;
  e.target.classList.toggle('primary', orbit.auto);
});
document.getElementById('btnSeed').addEventListener('click', ()=>{
  SEED = (Math.random()*1e9)|0;
  repaint();
});
document.getElementById('btnSave').addEventListener('click', ()=>{
  const out = document.createElement('canvas');
  out.width = 64; out.height = 64;
  out.getContext('2d').drawImage(CUR.canvas, 0, 0);
  const a = document.createElement('a');
  a.download = `cyber-teen-${CUR.desc.accent}-${CUR.desc.fit}-${CUR.desc.seed}.png`;
  a.href = out.toDataURL('image/png');
  a.click();
  // also export the cape PNG alongside
  const outC = document.createElement('canvas');
  outC.width = 64; outC.height = 32;
  outC.getContext('2d').drawImage(CUR.capeCanvas, 0, 0);
  const b = document.createElement('a');
  b.download = `cyber-teen-cape-${CUR.desc.accent}-${CUR.desc.seed}.png`;
  b.href = outC.toDataURL('image/png');
  setTimeout(()=>b.click(), 300);
});
document.getElementById('btnGallery').addEventListener('click', ()=> location.href = 'gallery.html');
document.getElementById('btnCape').addEventListener('click', e=>{
  capeOn = !capeOn;
  CHAR.setCape(capeOn);
  e.target.classList.toggle('on', capeOn);
});
document.querySelectorAll('[data-anim]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-anim]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    CHAR.setAnim(btn.dataset.anim);
  });
});

// ---------------- boot
resize();
animate();
document.getElementById('loader').classList.add('hide');
</script>
</body>
</html>
